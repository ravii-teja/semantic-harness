name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-build-and-test:
    name: "Python Build & Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: semantic-harness/python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies & build tools
        run: |
          python -m pip install --upgrade pip
          pip install hatch build
          pip install -e ".[dev]"

      - name: Python Build (Wheel & sdist artifact verification)
        run: python -m build

      - name: Run Python test suite with coverage
        run: pytest -v --cov=semantic_harness --cov-report=xml

      - name: Upload Python test coverage
        uses: codecov/codecov-action@v4
        with:
          files: semantic-harness/python/coverage.xml
        continue-on-error: true

  npm-build-and-test:
    name: "NPM Build & Test (Node 22)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: semantic-harness/npm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install NPM dependencies
        run: npm install

      - name: NPM Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: NPM Build (tsc -> dist/)
        run: npm run build

      - name: Run NPM test suite
        run: npm test

  benchmark-local:
    name: "Semantic Harness Local Benchmarks (Python 3.12)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package with benchmark dependencies
        run: pip install -e "./semantic-harness/python[dev,bench]"

      - name: Run local procedural cache & REPL benchmarks
        run: python3 semantic-harness/benchmarks/run_benchmark.py --benchmark cache repl
