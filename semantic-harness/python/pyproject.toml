[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-harness"
version = "0.1.0"
description = "Semantic middleware for AI agents — validate, remember, accelerate. Any framework, any model."
authors = [
    { name = "Ravi Teja" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["agents", "llm", "memory", "semantic", "harness", "ai", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "litellm>=1.0.0",
]

[project.optional-dependencies]
polars = ["polars>=0.20.0"]
all = ["polars>=0.20.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/ravii-teja/semantic-harness"
Repository = "https://github.com/ravii-teja/semantic-harness"
Documentation = "https://github.com/ravii-teja/semantic-harness#readme"

[tool.hatch.build.targets.wheel]
packages = ["semantic_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long lines in prompts/docstrings are fine
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
no_site_packages = false
exclude = [".venv"]
