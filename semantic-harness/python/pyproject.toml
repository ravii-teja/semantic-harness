[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-harness"
dynamic = ["version"]
description = "Cognitive middleware and procedural acceleration runtime for autonomous AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Ravi Teja", email = "raviteja@example.com" }
]
keywords = [
  "llm", "agents", "agentic", "ai", "semantic", "validation",
  "caching", "memory", "middleware", "openai", "anthropic", "ollama", "turboquant"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.0",
  "httpx>=0.27",
  "aiohttp>=3.9",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.28"]
ollama = ["ollama>=0.2"]
huggingface = ["huggingface_hub>=0.20"]
mlx = ["mlx>=0.16; sys_platform == 'darwin'", "mlx-lm>=0.16; sys_platform == 'darwin'"]
all = ["openai>=1.30", "anthropic>=0.28", "ollama>=0.2", "huggingface_hub>=0.20"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]
bench = ["tabulate>=0.9", "tqdm>=4.66"]

[project.urls]
Homepage = "https://github.com/ravii-teja/semantic-harness"
Documentation = "https://ravii-teja.github.io/semantic-harness"
Repository = "https://github.com/ravii-teja/semantic-harness"
"Bug Tracker" = "https://github.com/ravii-teja/semantic-harness/issues"

[tool.hatch.version]
path = "semantic_harness/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["semantic_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
